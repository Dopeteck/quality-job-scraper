[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-job-scraper"
version = "0.1.0"
description = "Quality-first remote, AI, and entry-level job scraper for Google Sheets and Make"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.13.4",
  "feedparser==6.0.11",
  "gspread==6.2.1",
  "python-dateutil==2.9.0.post0",
  "requests==2.32.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "responses==0.25.7", "ruff==0.12.3"]

[project.scripts]
quality-jobs = "quality_jobs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

