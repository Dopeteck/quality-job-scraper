name: Collect quality jobs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; do not write to Google Sheets"
        required: false
        default: true
        type: boolean
      max_per_run:
        description: "Maximum accepted jobs for this manual run"
        required: false
        default: "1"
        type: string
  schedule:
    # Lagos: 07:15 primary, 11:35 and 18:45 recovery attempts.
    # A shared daily quota stops after two submissions.
    - cron: "15 6 * * *"
    - cron: "35 10 * * *"
    - cron: "45 17 * * *"

permissions:
  contents: read

concurrency:
  group: quality-job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore legacy deduplication state during migration
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: quality-jobs-seen-${{ github.run_id }}
          restore-keys: |
            quality-jobs-seen-
      - name: Restore cross-run deduplication state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/seen.json
            data/daily.json
          key: quality-jobs-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quality-jobs-state-v2-
            quality-jobs-seen-
      - name: Install
        run: pip install .
      - name: Test curation and formatter
        run: pip install pytest==8.4.1 && pytest -q
      - name: Collect, score and publish
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET: QualityJobs
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          SITE_INGEST_URL: ${{ secrets.SITE_INGEST_URL }}
          SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
          MERCOR_REFERRAL_URL: ${{ secrets.MERCOR_REFERRAL_URL || 'https://t.mercor.com/H06sH' }}
          OUTLIER_REFERRAL_URL: ${{ secrets.OUTLIER_REFERRAL_URL }}
          MAX_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_per_run || '2' }}
          STATE_PATH: data/seen.json
          USER_AGENT: RemoteJobsWorldwide/1.0
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            quality-jobs --dry-run
          elif [ -z "$MAKE_WEBHOOK_URL" ] && { [ -z "$GOOGLE_SHEET_ID" ] || [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; }; then
            echo "::notice::No Make webhook or Google Sheets credentials are configured; running a safe preview instead."
            quality-jobs --dry-run
          else
            quality-jobs --daily-limit 2
          fi
      - name: Save cross-run deduplication state
        if: always() && !cancelled() && steps.restore-state.outcome == 'success' && hashFiles('data/seen.json') != '' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        uses: actions/cache/save@v4
        with:
          path: |
            data/seen.json
            data/daily.json
          key: quality-jobs-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
